name: MahjongAura
options:
  bundleIdPrefix: com.mahjongaura
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: K858B9M275
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.9.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0

schemes:
  MahjongAura:
    build:
      targets:
        MahjongAura: all
    run:
      config: Debug
      # Simülatörde satın alma testi için yerel ürün tanımları.
      # Gerçek ürünler ASC'de; bu dosya yalnızca geliştirme içindir.
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
    profile:
      config: Release

targets:
  MahjongAura:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahjongaura.app
        PRODUCT_NAME: MahjongAura
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "20"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mahjong Aura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # 2.0.1'de bu alan HİÇ YOKTU — App Store uygulamayı tek dil gösteriyordu.
        # Her yeni dil ayrı bir 100 karakterlik keyword alanı demek (bkz. ASO notu).
        CFBundleLocalizations:
          - en
          - tr
          - de
          - es
          - fr
          - pt-BR
          - zh-Hans
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPad için AYRI anahtar tanımlanmıyor — kasıtlı.
        # `…~ipad` anahtarını yalnızca portrait ile doldurmak, Apple'ın iPad
        # çoklu görev kuralını tetikliyor ve yükleme 409 ile reddediliyor.
        # Yayındaki 2.0.1 de bu anahtarı hiç tanımlamıyor; birebir aynısı.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        GADApplicationIdentifier: ca-app-pub-8571533711927103~6034352154
