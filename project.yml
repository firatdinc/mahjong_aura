name: MahjongAura
options:
  bundleIdPrefix: com.mahjongaura
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  MahjongAura:
    build:
      targets:
        MahjongAura: all
    run:
      config: Debug
      # Simülatörde satın alma testi için yerel ürün tanımları.
      # Gerçek ürünler ASC'de; bu dosya yalnızca geliştirme içindir.
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
    profile:
      config: Release

targets:
  MahjongAura:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahjongaura.app
        PRODUCT_NAME: MahjongAura
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "15"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mahjong Aura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # 2.0.1'de bu alan HİÇ YOKTU — App Store uygulamayı tek dil gösteriyordu.
        # Her yeni dil ayrı bir 100 karakterlik keyword alanı demek (bkz. ASO notu).
        CFBundleLocalizations:
          - en
          - tr
          - de
          - es
          - fr
          - zh-Hans
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        GADApplicationIdentifier: ca-app-pub-8571533711927103~6034352154
        NSUserTrackingUsageDescription: This identifier will be used to deliver personalized ads to you.
        SKAdNetworkItems:
